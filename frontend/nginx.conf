# Public listener: only participant APIs are reachable, regardless of Host.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = /api/health {
        include /etc/nginx/api-proxy.conf;
    }

    location ~ ^/api/(events|tickets)(/|$) {
        include /etc/nginx/api-proxy.conf;
    }

    location /api/ {
        return 404;
    }

    location ~ ^/(login|organizer)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Private listener: publish on loopback only; use SSH/VPN for remote access.
server {
    listen 8081 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        include /etc/nginx/api-proxy.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
