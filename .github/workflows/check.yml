name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build, lint, and test the full application
        run: ./scripts/test.sh
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: frontend/test-results
          if-no-files-found: ignore
