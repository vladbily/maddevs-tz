services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events
      POSTGRES_DB: events
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://events:events@postgres:5432/events
      ORGANIZER_PASSWORD: ${ORGANIZER_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${APP_PORT:-8080}}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
      - "127.0.0.1:${ORGANIZER_PORT:-8081}:8081"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
